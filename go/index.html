  <title>Get Delixio — Redirecting</title>

  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/us/app/delixio/id6774958116';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.fridgemeal.fridgemeal';
      var FALLBACK = '/download/';
      var ua = navigator.userAgent || '';

      // iPadOS 13+ may report as Macintosh; treat touch Macs as iOS.
      var isIos = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      if (isIos) {
        window.location.replace(APP_STORE);
      } else if (isAndroid) {
        window.location.replace(PLAY_STORE);
      } else {
        window.location.replace(FALLBACK);
      }
    })();
  </script>
